:root{--red:#ff3b30;--red2:#e8461c;--neon:#ff2a2a;--ink:#07080b;--panel:rgba(10,12,18,.88);--panel2:rgba(18,21,30,.92);--line:rgba(255,255,255,.12);--txt:#fff;--muted:#9aa3b2;--gold:#ffc23d;--green:#3dff6a;--blue:#3d8bff;
  --f:"Barlow Condensed","Arial Narrow",Arial,sans-serif;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:var(--f);overflow:hidden;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;display:block;z-index:0}
canvas#hud2d{position:fixed;inset:0;pointer-events:none;z-index:3}
.hidden{display:none!important}
/* ---------------- HUD ---------------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
#scorebug{position:absolute;left:50%;bottom:2.2vh;transform:translateX(-50%) scale(var(--sbs,1));transform-origin:50% 100%;display:flex;align-items:stretch;height:96px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));font-weight:800}
.sb-team{position:relative;width:206px;display:flex;flex-direction:column}
.sb-to{height:12px;display:flex;gap:6px;justify-content:center;align-items:center;padding:0 18px}
.sb-to i{display:block;width:18px;height:3px;background:#fff;border-radius:1px;opacity:.95}
.sb-body{flex:1;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 88%,#fff 12%),var(--tc) 55%,color-mix(in srgb,var(--tc) 80%,#000 20%));display:flex;align-items:center;color:var(--tt);border-top:2px solid rgba(255,255,255,.35)}
.sb-away .sb-body{border-radius:6px 0 0 6px;padding:0 14px 0 42px}
.sb-home .sb-body{border-radius:0 6px 6px 0;padding:0 42px 0 14px;flex-direction:row-reverse}
.sb-ab{position:absolute;top:50%;font-size:24px;letter-spacing:.06em;font-style:normal;font-weight:800;color:var(--tt);opacity:.95}
.sb-away .sb-ab{left:2px;transform:translateY(-50%) rotate(-90deg)}
.sb-home .sb-ab{right:2px;transform:translateY(-50%) rotate(90deg)}
.sb-logo{width:60px;height:60px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.sb-score{flex:1;text-align:center;font-size:58px;line-height:1;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sb-fls{position:absolute;bottom:6px;font-size:15px;font-weight:700;letter-spacing:.04em;opacity:.85}
.sb-away .sb-fls{right:28px}.sb-home .sb-fls{left:28px}
.sb-bonus{position:absolute;top:5px;font-size:13px;font-weight:800;letter-spacing:.08em;background:#ffd23d;color:#111;padding:0 6px;border-radius:2px;opacity:0;transition:opacity .3s}
.sb-away .sb-bonus{right:10px}.sb-home .sb-bonus{left:10px}
.sb-poss{position:absolute;bottom:-7px;left:50%;width:40px;height:4px;margin-left:-20px;background:#ffd23d;border-radius:2px;opacity:0;transition:opacity .25s;box-shadow:0 0 8px #ffd23d}
.sb-team.pop .sb-score{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1.35);text-shadow:0 0 18px #fff}100%{transform:scale(1)}}
.sb-mid{width:150px;margin-top:12px;background:linear-gradient(180deg,#1b1f2a,#0b0d12);display:flex;flex-direction:column;align-items:center;justify-content:center;border-top:2px solid rgba(255,255,255,.25);position:relative}
.sb-brand{font-style:italic;font-weight:900;font-size:21px;letter-spacing:.02em;line-height:1;color:#fff;text-shadow:0 0 10px rgba(255,60,40,.9),0 0 2px #ff6040;margin-top:-6px}
.sb-brand b{color:#ff4630;text-shadow:0 0 10px rgba(255,60,40,1),0 0 22px rgba(255,40,20,.7);margin-left:2px}
.sb-clock{font-size:42px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}

.lt-acc{width:10px}.lt-main{background:rgba(8,10,15,.92);padding:8px 22px 10px;display:flex;flex-direction:column;justify-content:center}

#careerHud{position:absolute;right:2.2vw;top:2.4vh;display:flex;align-items:center;gap:6px;background:rgba(12,10,22,.88);border:2px solid #6b4bd6;padding:6px 14px;border-radius:4px;box-shadow:0 0 18px rgba(110,70,255,.35)}
#careerHud .cbs{display:flex;gap:6px;margin-right:6px}
#careerHud .cb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8a6bff,#3a2490);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;border:2px solid #b9a6ff}
#careerHud .cgrade{width:58px;height:58px;border-radius:50%;background:conic-gradient(#ffc23d calc(var(--g)*360deg),rgba(255,255,255,.15) 0);display:flex;align-items:center;justify-content:center}

#gradeToasts{position:absolute;right:2.4vw;top:12vh;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

#ctrlCard{position:absolute;top:1.6vh;right:1.1vw;width:clamp(215px,15.5vw,300px);padding:8px 10px 7px;border-radius:8px;background:rgba(6,9,16,.6);border:1px solid rgba(255,255,255,.16);color:#fff;font:600 clamp(11.5px,.8vw,14.5px)/1.3 'Barlow Condensed',sans-serif;text-shadow:0 1px 2px #000;pointer-events:none;opacity:0;transition:opacity .3s;z-index:4}

#ctrlHint{position:absolute;left:2vw;bottom:2.4vh;font-size:16px;font-weight:700;color:rgba(255,255,255,.75);text-shadow:0 1px 3px #000;max-width:30vw;line-height:1.35}

#contestHud{position:absolute;left:50%;top:3vh;transform:translateX(-50%);display:none}

.ch-box{background:rgba(8,10,15,.9);border-top:3px solid var(--red);padding:10px 24px;display:flex;gap:28px;align-items:center;font-weight:800}
.ch-box .big{font-size:52px;line-height:1;font-variant-numeric:tabular-nums}.ch-box .lab{font-size:15px;color:var(--muted);letter-spacing:.1em}

/* ---------------- overlays (intro, timeout, halftime, final) ---------------- */
#overlay{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;pointer-events:none}

.ovl-card{background:var(--panel);border-top:4px solid var(--red);padding:22px 34px 18px;min-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .35s ease}
