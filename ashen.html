function updateAtmosphere(dt){
  if(!P.group) return;
  const z = P.group.position.z;
  const idx = Math.max(0, Math.min(REGIONS.length-1, regionAt(z)));
  const reg = REGIONS[idx];
  const cfg = QUALITY_PRESETS[S.settings.quality] || QUALITY_PRESETS.medium;

  const targetFog = new THREE.Color(reg.fog);
  G.scene.fog.color.lerp(targetFog, 1-Math.exp(-1.2*dt));
  G.scene.fog.density = damp(G.scene.fog.density, reg.density * cfg.fogScale, 1.2, dt);
  G.scene.background.lerp(new THREE.Color(reg.ground), 1-Math.exp(-1.2*dt));
  G.hemi.color.lerp(new THREE.Color(reg.sky), 1-Math.exp(-1.2*dt));
  G.hemi.intensity = damp(G.hemi.intensity, reg.amb, 1.2, dt);

  if(M.water.uniforms){
    M.water.uniforms.uFogColor.value.copy(G.scene.fog.color);
    M.water.uniforms.uFogDensity.value = G.scene.fog.density;
  }

  G.sun.position.set(P.group.position.x - 18, 30, P.group.position.z + 12);
  G.sun.target.position.set(P.group.position.x, 0, P.group.position.z);
  G.sun.target.updateMatrixWorld();
}

function updateDog(dt){
  if(!G.dog || !G.dog.visible || !P.group) return;
  const dog = G.dog;
  const u = dog.userData;
  const targetZ = P.group.position.z + (Q.stage === 'trail' || Q.stage === 'bell' ? -2.2 : 1.4);
  const target = V3(P.group.position.x + Math.sin(P.facing) * 1.4, 0, targetZ);
  const dist = dog.position.distanceTo(target);
  if(dist > 9) dog.position.copy(target);
  else dog.position.lerp(target, 1-Math.pow(0.0015, dt * (dist > 2 ? 2.6 : 1.5)));
  const dx = target.x - dog.position.x, dz = target.z - dog.position.z;
  if(dx*dx + dz*dz > 0.04) dog.rotation.y = Math.atan2(dx, dz);
  u.walk += dt * (dist > 1 ? 9 : 2.5);
  u.body.position.y = 0.7 + Math.abs(Math.sin(u.walk)) * (dist > 1 ? 0.04 : 0.008);
  u.head.rotation.x = dist > 1 ? Math.sin(u.walk) * 0.05 : Math.sin(G.time * 1.4) * 0.03;
  if(u.tail) u.tail.rotation.z = Math.sin(G.time * 6) * 0.25;
}

function updateAlly(dt){
  if(!G.ally || !P.group) return;
  const ally = G.ally;
  const target = V3(
    P.group.position.x + Math.sin(P.facing + Math.PI/2) * 2.2 - Math.sin(P.facing) * 1.0,
    0,
    P.group.position.z + Math.cos(P.facing + Math.PI/2) * 2.2 - Math.cos(P.facing) * 1.0
  );
  const dist = ally.position.distanceTo(target);
  if(dist > 3) ally.position.lerp(target, 1-Math.pow(0.0015, dt * (dist > 9 ? 3.5 : 1.5)));
  const dx = P.group.position.x - ally.position.x;
  const dz = P.group.position.z - ally.position.z;
  if(dx*dx + dz*dz > 0.1) ally.rotation.y = Math.atan2(dx, dz);
  ally.userData.walk = (ally.userData.walk || 0) + dt * 6;
  ally.userData.body.position.y = 1.1 + (dist > 1.2 ? Math.abs(Math.sin(ally.userData.walk)) * 0.025 : 0);
  if(G.allyObj.cd > 0) G.allyObj.cd = Math.max(0, G.allyObj.cd - dt);
}

function updatePrompt(){
  const it = nearestInteractable();
  const el = $('#prompt');
  if(it){ el.textContent = '[E] ' + it.label; el.classList.add('on'); }
  else el.classList.remove('on');

  for(const i of G.interactables){
    if(!i.marker) continue;
    const d = Math.hypot(i.x - P.group.position.x, i.z - P.group.position.z);
    const targetOp = (d < 7 && !(i.used && i.once)) ? 0.75 : 0;
    i.marker.material.opacity = damp(i.marker.material.opacity, targetOp, 6, dtGlobal);
    i.marker.position.y = 1.6 + Math.sin(G.time * 2 + i.x) * 0.08;
    i.marker.rotation.y += dtGlobal * 1.5;
  }
}

function updateGame(dt){
  const scaled = dt * G.timeScale;
  updatePlayerMovement(scaled);
  updatePlayerCombat(scaled);
  updatePlayerAnim(scaled);
  updateEnemies(scaled);
  updateProjectiles(scaled);
  updateFX(scaled);
  updateAmbient(scaled);
  updateDog(scaled);
  updateAlly(scaled);
  updateAtmosphere(scaled);
  updatePrompt();
  Dialogue.update(dt);

  if(G.bell && G.bell.userData.swing > 0){
    G.bell.userData.swing = Math.max(0, G.bell.userData.swing - dt * 0.6);
    G.bell.rotation.z = Math.sin(G.time * 6) * G.bell.userData.swing * 0.25;
  }

  if(P.group.position.z < S.checkpoint.z - 18) S.checkpoint = { x:0, z:P.group.position.z };

  const anyAggro = G.enemies.some(e => e.alive && e.aggro && e.mesh.position.distanceTo(P.group.position) < 18);
  if(!anyAggro && S.hp < S.maxHp && S.hp > 0) S.hp = Math.min(S.maxHp, S.hp + dt * 1.4);

  const need = 100 * S.level;
  if(S.xp >= need){
    S.xp -= need;
    S.level++;
    S.maxHp += 8; S.hp = S.maxHp;
    S.maxStam += 4; S.skill++;
    toast('LEVEL UP · ' + S.level);
    AudioSys.sfx('level');
    Dialogue.say('Mara', 'You’re getting stronger. Try not to mistake that for being right.');
    saveGame();
  }

  if(G.time - G.lastBark > 22 && Math.random() < dt * 0.1 && !G.dialogue.current){
    G.lastBark = G.time;
    if(Q.stage === 'search'){
      Dialogue.say('Mara', pick([
        'There are footprints going into the water. None coming back out.',
        'This village had a name once. Someone scraped it off the gate.',
        'The ash is too even. This was not a fire. This was a decision.'
      ]));
    } else if(Q.stage === 'bell'){
      Dialogue.say('Mara', pick([
        'The causeway is older than the kingdom. It was built to be walked on by the dead.',
        'Every lantern still burns. Who lights them?',
        'I can hear the bell through the water. That should not be possible.'
      ]));
    }
  }

  if(!anyAggro) S.rage = Math.max(0, S.rage - dt * 1.2);
}

function updateMenu(dt){
  const a = G.realTime * 0.09;
  const r = 21;
  G.camera.position.set(Math.sin(a) * r, 6.5 + Math.sin(a*0.6)*1.4, 2 + Math.cos(a) * r);
  G.camera.lookAt(0, 2.0, -2);
  updateAmbient(dt);
  Dialogue.update(dt);
}

function render(){
  if(G.composer && S.settings.bloom && G.bloom && G.bloom.enabled){
    G.composer.render();
  } else {
    G.renderer.render(G.scene, G.camera);
  }
}

/* =========================================================
   32 · MAIN LOOP
   ========================================================= */
function loop(){
  requestAnimationFrame(loop);
  const rawDt = Math.min(G.clock.getDelta(), 0.05);
  G.realTime += rawDt;
  G.time += rawDt;
  dtGlobal = rawDt;

  G.shake = Math.max(0, G.shake - rawDt * 0.9);

  if(G.menu){
    updateMenu(rawDt);
    render();
    return;
  }

  if(Cinematic.active){
    Cinematic.update(rawDt);
    updateAmbient(rawDt);
    Dialogue.update(rawDt);
    updateFX(rawDt);
    render();
    return;
  }

  if(G.hitstop > 0){
    G.hitstop -= rawDt;
    Dialogue.update(rawDt);
    updateAmbient(rawDt);
    render();
    return;
  }

  if(!G.paused && !G.dead){
    updateGame(rawDt);
    updateCamera(rawDt);
    FPSWatch.tick(rawDt);
  } else if(G.dead){
    updateCamera(rawDt);
  }

  G.hudTimer -= rawDt;
  if(G.hudTimer <= 0){ G.hudTimer = 0.05; updateHUD(); updateCamera(rawDt); }

  G.mmTimer -= rawDt;
  if(G.mmTimer <= 0){ G.mmTimer = 0.08; drawMinimap(); }

  if(G.toastTimer > 0){ G.toastTimer -= rawDt; if(G.toastTimer <= 0) $('#toast').classList.remove('on'); }
  if(G.tipTimer > 0){ G.tipTimer -= rawDt; if(G.tipTimer <= 0) $('#combatTip').classList.remove('on'); }

  M.water.uniforms.uTime.value = G.time;

  render();
}

/* =========================================================
   33 · BOOT
   ========================================================= */
function boot(){
  AutoQuality.detect();       // sets S.settings.quality from device/GPU detection
  initScene();                // scene reads preset for initial values
  AutoQuality.apply(S.settings.quality, true);  // sync embers/dust draw-range, bloom, etc.
  bindInput();
  pollGamepad();
  showTitle();
  loop();

  setTimeout(()=>{
    $('#hint').classList.add('on');
    setTimeout(()=>$('#hint').classList.remove('on'), 6500);
  }, 1200);
}

boot();

</script>
