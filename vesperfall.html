<title>VESPERFALL — A Dark Fantasy Action RPG</title>
<style>
:root{--gold:#d8b377;--gold-hi:#f5dca8;--gold-dim:#8a6f4a;--line:rgba(216,179,119,.25);--blood:#c0473f;--teal:#86d9cf;--text:#eee4d3;--dim:#a99f8f;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:"Helvetica Neue",Arial,sans-serif}

#hpF{background:linear-gradient(180deg,#d8574c,#8e2424)}

#quest{position:absolute;top:250px;right:22px;text-align:right;max-width:290px}

.bossbar{height:11px;background:rgba(22,14,14,.92);border:1px solid rgba(216,179,119,.45);position:relative;overflow:hidden}

.kicker{font:10px var(--sans);letter-spacing:6px;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(38px,9vw,76px);line-height:.92;letter-spacing:4px;font-weight:400;margin:14px 0;text-transform:uppercase}

.desc{color:#c9c1b3;line-height:1.65;font-size:15px;margin-bottom:10px}
.small{font:11px/1.7 var(--sans);color:#8f8a80;margin-top:16px}
.menurow{display:flex;flex-wrap:wrap;margin-top:20px}
button{font:11px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--text);background:rgba(30,34,40,.9);border:1px solid var(--line);padding:12px 16px;cursor:pointer;margin:6px 8px 0 0;transition:all .16s}

select{font:11px var(--sans);background:#1a1e24;color:var(--text);border:1px solid var(--line);padding:8px 10px;margin-left:8px}
label{display:flex;align-items:center;gap:9px;color:#c9c1b3;font:12px var(--sans);margin:9px 0;cursor:pointer}
.rowline{display:flex;align-items:center;gap:12px;margin:10px 0;color:#c9c1b3;font:12px var(--sans)}
.stat{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--line);margin-top:7px;background:rgba(20,24,30,.6);font:13px var(--sans);letter-spacing:1px}

.stat button{margin:0;padding:7px 14px}
.lore{border-left:2px solid var(--gold-dim);padding:4px 0 4px 12px;margin:12px 0}
.lore strong{display:block;font:11px var(--sans);letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:3px}
.lore span{font-size:14px;line-height:1.55;color:#c9c1b3;font-style:italic}
table.ctl{font:12px var(--sans);color:#c9c1b3;border-collapse:collapse;margin-top:8px;width:100%}

#cinebars{position:fixed;inset:0;z-index:9;pointer-events:none;display:none}

#cineTitle.on{opacity:1}
.ct-kicker{font:10px var(--sans);letter-spacing:7px;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
.ct-main{font-size:clamp(28px,5.5vw,54px);letter-spacing:8px;color:#f2e6d0;text-transform:uppercase;text-shadow:0 4px 30px #000}
.ct-sub{margin-top:14px;font:11px var(--sans);letter-spacing:5px;color:#bcaa8f;text-transform:uppercase}
#cineBoss{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:9;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
#cineBoss.on{opacity:1}
.cb-name{font-size:clamp(24px,4.5vw,44px);letter-spacing:8px;color:#f2e6d0;text-transform:uppercase;text-shadow:0 4px 30px #000,0 0 60px rgba(192,71,63,.4)}
.cb-line{margin-top:10px;font:11px var(--sans);letter-spacing:4px;color:#c0473f;text-transform:uppercase}
/* touch */
#touch{position:fixed;inset:0;z-index:15;display:none;pointer-events:none}
#touch.on{display:block}
#stick{position:absolute;left:24px;bottom:96px;width:130px;height:130px;border-radius:50%;border:2px solid rgba(216,179,119,.3);background:rgba(0,0,0,.25);pointer-events:auto}
#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:rgba(216,179,119,.45)}
#lookpad{position:absolute;right:0;top:0;width:45vw;bottom:0;pointer-events:auto}
.tb{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid rgba(216,179,119,.45);background:rgba(10,12,16,.55);color:#f5dca8;font:10px var(--sans);display:flex;align-items:center;justify-content:center;pointer-events:auto;letter-spacing:1px;margin:0;padding:0}
@media(max-width:820px){#bars{left:12px;top:12px}#minimapWrap{right:10px;top:10px}#quest{right:12px;max-width:42vw}#objective{font-size:12px}#region{left:12px;top:70px;font-size:8px}#equip{left:12px;bottom:12px;font-size:9px}#runes{right:14px;bottom:auto;top:290px;font-size:16px;display:none}#hint{display:none}#subs{bottom:30%}#bossHud{bottom:26%}#prompt{bottom:36%}}
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ===== 0 · HELPERS ===== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const rand = (a=0,b=1) => a + Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];
const damp = (a,b,l,dt) => lerp(a,b,1-Math.exp(-l*dt));
const smooth = x => x*x*(3-2*x);
const TAU = Math.PI*2;
const V3 = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const angDiff = (a,b) => { let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; };
const fmt = n => Math.floor(n).toLocaleString('en-US');

/* ===== 1 · AUDIO ===== */
const AudioSys = {
  ctx:null, master:null, music:null, sfxGain:null, tensG:null, enabled:true, musicOn:true, ready:false,
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.75; this.master.connect(this.ctx.destination);
    this.sfxGain = this.ctx.createGain(); this.sfxGain.connect(this.master);
    this.music = this.ctx.createGain(); this.music.gain.value = 0; this.music.connect(this.master);
    this.ready = true; this.startDrone();
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,dur=.12,type='sine',vol=.05,slide=null,delay=0){
    if(!this.ready||!this.enabled) return;
    const t=this.ctx.currentTime+delay, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(Math.max(20,f),t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t+dur+.03);
  },
  noise(dur=.1,vol=.05,freq=1200,q=1,delay=0){
    if(!this.ready||!this.enabled) return;
    const t=this.ctx.currentTime+delay, len=Math.max(1,Math.floor(this.ctx.sampleRate*dur));
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=this.ctx.createBufferSource(); s.buffer=buf;
    const fl=this.ctx.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=freq; fl.Q.value=q;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(fl); fl.connect(g); g.connect(this.sfxGain); s.start(t);
  },
  sfx(n){
    if(!this.enabled) return;
    switch(n){
      case 'hit': this.noise(.09,.1,1900,1.3); this.tone(130,.07,'square',.025,70); break;
      case 'heavy': this.noise(.2,.14,800,.8); this.tone(80,.22,'sawtooth',.06,40); break;
      case 'crit': this.noise(.2,.14,2600,1.6); this.tone(240,.22,'triangle',.07,90); this.tone(90,.3,'sawtooth',.06,40); break;
      case 'swing': this.noise(.15,.045,1500,.6); break;
      case 'parry': this.tone(920,.12,'triangle',.08); this.tone(1380,.18,'sine',.05,null,.02); this.noise(.12,.06,3200,2); break;
      case 'dodge': this.noise(.16,.04,600,.6); break;
      case 'magic': this.tone(520,.28,'sine',.05,1100); break;
      case 'hurt': this.tone(95,.22,'square',.06,45); this.noise(.16,.05,420,.7); break;
      case 'block': this.noise(.11,.08,900,1.1); this.tone(160,.1,'square',.035,110); break;
      case 'level': [523,659,784,1046].forEach((f,i)=>this.tone(f,.34,'sine',.05,null,i*.09)); break;
      case 'win': [392,523,659,784,1046].forEach((f,i)=>this.tone(f,.7,'triangle',.055,null,i*.17)); break;
      case 'ui': this.tone(700,.05,'sine',.028); break;
      case 'ui2': this.tone(440,.07,'sine',.03); break;
      case 'roar': this.tone(62,.8,'sawtooth',.09,36); this.noise(.7,.08,180,.5); break;
      case 'bell': [196,294,392,588].forEach((f,i)=>this.tone(f,2.4,'sine',.06,null,i*.05)); break;
      case 'pickup': this.tone(660,.09,'triangle',.04); this.tone(990,.14,'sine',.03,null,.06); break;
      case 'grace': [392,494,587,784].forEach((f,i)=>this.tone(f,1.2,'sine',.04,null,i*.14)); break;
      case 'flask': this.tone(300,.4,'sine',.04,700); this.noise(.3,.02,2000,1); break;
      case 'gate': this.tone(70,1,'sawtooth',.07,40); this.noise(.9,.06,300,.5); break;
      case 'step': this.noise(.05,.018,260,.8); break;
      case 'death': this.tone(110,1.6,'sawtooth',.07,36); this.noise(1.1,.07,200,.5); break;
      case 'boom': this.tone(50,.6,'sine',.1,28); this.noise(.5,.1,140,.5); break;
    }
  },
  startDrone(){
    const t=this.ctx.currentTime;
    [55,82.5,110,164.8].forEach((f,i)=>{
      const o=this.ctx.createOscillator(); o.type=i%2?'triangle':'sine'; o.frequency.value=f;

const LS = { src:[], pool:[], t:0 };

function updateLights(dt){
  LS.t-=dt;
  if(LS.t<=0 && P.group){
    LS.t=.2; const px=P.group.position.x, pz=P.group.position.z;
    const sorted=LS.src.map(s=>({s,d:(s.x-px)**2+(s.z-pz)**2})).sort((a,b)=>a.d-b.d).slice(0,LS.pool.length).map(o=>o.s);
    for(const p of LS.pool) if(p.s && !sorted.includes(p.s)) p.s=null;
    for(const s of sorted){ if(LS.pool.some(p=>p.s===s)) continue; const f=LS.pool.find(p=>!p.s); if(f){ f.s=s; f.l.intensity=0; } }
  }
  for(const p of LS.pool){
    if(p.s){ p.l.position.set(p.s.x,p.s.y,p.s.z); p.l.color.copy(p.s.color); p.l.distance=p.s.d; p.l.intensity+=(p.s.i-p.l.intensity)*Math.min(1,dt*5); }

}

function limbGeo(len,r0,r1,at=.3,bulge=1.12,seg=10){
  const key=[len,r0,r1,at,bulge,seg].join('_'); if(geoCache[key]) return geoCache[key];

  init(){ const geo=new THREE.IcosahedronGeometry(1,0);

  spawn(pos,color,count=8,o={}){

  for(const gr of G.graces){ const x=cx+(gr.x-px)*sc,y=cy+(gr.z-pz)*sc; if(Math.hypot(x-cx,y-cy)>W/2-4) continue; c.fillStyle=S.graces.includes(gr.id)?'#ffd98a':'rgba(255,217,138,.35)'; c.beginPath(); c.arc(x,y,4,0,TAU); c.fill(); }
  for(const e of G.enemies){ if(!e.alive) continue; const x=cx+(e.mesh.position.x-px)*sc,y=cy+(e.mesh.position.z-pz)*sc; if(Math.hypot(x-cx,y-cy)>W/2-4) continue;
    c.fillStyle=e.boss?'#c0473f':'rgba(224,96,80,.9)'; c.beginPath(); c.arc(x,y,e.boss?5:2.4,0,TAU); c.fill(); }
  for(const it of G.interactables){ if(!it.minimap||(it.when&&!it.when())) continue; const x=cx+(it.x-px)*sc,y=cy+(it.z-pz)*sc; if(Math.hypot(x-cx,y-cy)>W/2-4) continue;
    c.save(); c.translate(x,y); c.rotate(Math.PI/4); c.fillStyle='rgba(245,220,168,.9)'; c.fillRect(-2.5,-2.5,5,5); c.restore(); }

  const wp=objectiveWaypoint(); if(wp){ let dx=(wp.x-px)*sc, dy=(wp.z-pz)*sc; const d=Math.hypot(dx,dy), lim=W/2-14; if(d>lim){ dx*=lim/d; dy*=lim/d; }
    c.save(); c.translate(cx+dx,cy+dy); c.rotate(Math.atan2(dy,dx)+Math.PI/2); c.fillStyle='#ffd98a'; c.strokeStyle='#000'; c.lineWidth=2; c.beginPath(); c.moveTo(0,-9); c.lineTo(7,7); c.lineTo(0,3); c.lineTo(-7,7); c.closePath(); c.stroke(); c.fill(); c.restore(); }
  c.save(); c.translate(cx,cy); c.rotate(-(P.facing)+Math.PI); c.fillStyle='#f5f0e4'; c.beginPath(); c.moveTo(0,-6); c.lineTo(4,5); c.lineTo(0,2.5); c.lineTo(-4,5); c.closePath(); c.fill(); c.restore();

/* ===== 16 · CAMERA / CINEMATIC ===== */
const Cinematic = {
  active:false,t:0,dur:0,keys:[],onEnd:null,
  start(keys,dur,onEnd){ this.active=true; this.t=0; this.dur=dur; this.keys=keys; this.onEnd=onEnd; $('#cinebars').classList.add('on'); G.paused=false; },
  update(dt){
    this.t+=dt; const k=this.keys; let i=0; while(i<k.length-2&&this.t>k[i+1].t) i++;
    const a=k[i],b=k[i+1],s=smooth(clamp((this.t-a.t)/Math.max(.001,b.t-a.t),0,1));
    G.camera.position.lerpVectors(a.pos,b.pos,s); G.camera.lookAt(new THREE.Vector3().lerpVectors(a.look,b.look,s));
    if(this.t>=this.dur){ this.active=false; $('#cinebars').classList.remove('on'); if(this.onEnd) this.onEnd(); }
  }
};
function updateCamera(dt,imm=false){
  if(!P.group) return;
  const tgt=P.group.position.clone(); tgt.y+=1.5;
  let dist=G.camDist, locked=G.lock&&G.lock.alive;
  if(locked){
    const t=G.lock.mesh.position, dx=t.x-P.group.position.x, dz=t.z-P.group.position.z;
    G.camYaw+=angDiff(G.camYaw,Math.atan2(dx,dz))*(1-Math.exp(-6*dt));
    G.camPitch=damp(G.camPitch,.24,3,dt); dist+=G.lock.boss?1.8:.4;
  }
  const cp=Math.cos(G.camPitch), sp=Math.sin(G.camPitch);
  const rx=-Math.cos(G.camYaw)*.55, rz=Math.sin(G.camYaw)*.55;
  const desired=tgt.clone().add(V3(-Math.sin(G.camYaw)*cp*dist+rx, sp*dist+.25, -Math.cos(G.camYaw)*cp*dist+rz));
  if(desired.y<.5) desired.y=.5;
  if(imm) G.camera.position.copy(desired); else G.camera.position.lerp(desired,1-Math.exp(-14*dt));
  const look=tgt.clone().add(V3(rx*.8,0,rz*.8));
  if(locked){ const t=G.lock.mesh.position.clone(); t.y+=1.2; look.lerp(t,.3); }
  if(G.shake>0){ const s=G.shake; G.camera.position.x+=rand(-s,s)*.35; G.camera.position.y+=rand(-s,s)*.35; look.x+=rand(-s,s)*.15; }
  G.camera.lookAt(look);
}

function damageEnemy(e,dmg,o={}){

    if(o.heavy){ e.state='stagger'; e.t=0; e.stagDur=1.8; e.posture=e.poise; e.mv=null; e.tg.visible=false; combatTip('GUARD BROKEN',1.2); AudioSys.sfx('parry'); }

  else if(o.heavy) tag='heavy';
  const was=e.aggro; e.aggro=true; e.unaware=false;
  if(!was) alertNearby(e);
  e.hp-=final; e.accum+=final; e.accumT=2.4; G.lastHit=e; G.lastHitT=3; e.hitT=.14; e.posture+=(o.poise||14); e.dmgTaken+=final;
  AudioSys.sfx(tag==='crit'?'crit':o.heavy?'heavy':'hit');
  FX.spawn(e.mesh.position.clone().add(V3(0,1.2*e.cfg.scale,0)),tag==='crit'?0xffa06a:o.heavy?0xffcf7a:0xe7e1d2,tag==='crit'?18:o.heavy?14:7,{speed:o.heavy?5:3.5,size:.06,life:.35});

  return true;

function updateProjectiles(dt){
  for(let i=G.projectiles.length-1;i>=0;i--){
    const p=G.projectiles[i]; p.life-=dt;
    if(p.homing&&p.from==='enemy'){ const t=P.group.position.clone().add(V3(0,1,0)).sub(p.mesh.position).normalize(), sp=p.vel.length(); p.vel.lerp(t.multiplyScalar(sp),Math.min(1,p.homing*dt)); }
    p.mesh.position.addScaledVector(p.vel,dt);
    if(p.life<=0||Math.abs(p.mesh.position.x)>30||p.mesh.position.z<-140){ G.scene.remove(p.mesh); G.projectiles.splice(i,1); continue; }
    if(Math.random()<.6) FX.spawn(p.mesh.position.clone(),p.from==='player'?0xffcf7a:(p.col||0xff6a4a),1,{speed:.3,size:.05,life:.25,gravity:0});
    if(p.from==='player'){
      for(const e of G.enemies){ if(!e.alive||(p.hit&&p.hit.has(e))) continue;
        if(p.mesh.position.distanceTo(e.mesh.position.clone().add(V3(0,1.1,0)))<1+p.radius){ damageEnemy(e,p.dmg,{heavy:true,poise:p.poise||20,art:true}); if(p.pierce){ p.hit.add(e); } else { G.scene.remove(p.mesh); G.projectiles.splice(i,1); break; } } }
    } else {
      if(p.mesh.position.distanceTo(P.group.position.clone().add(V3(0,1,0)))<.7+p.radius){
        const r=hurtPlayer({dmg:p.dmg,x:p.mesh.position.x-p.vel.x*.1,z:p.mesh.position.z-p.vel.z*.1,parryable:false,poise:30});
        if(r!=='dodge'){ G.scene.remove(p.mesh); G.projectiles.splice(i,1); }
      }
    }
  }
}
function updateFX(dt){
  FX.update(dt);
  for(let i=G.fx.length-1;i>=0;i--){ const f=G.fx[i];
    if(f.type==='fire'){ f.phase+=dt*8; const fl=.82+Math.sin(f.phase)*.12+Math.sin(f.phase*2.3)*.06; f.src.i=f.base*fl; f.flame.scale.y=.85+fl*.15; f.flame.rotation.z=Math.sin(f.phase*.7)*.06; }
    else if(f.type==='lantern'){ f.phase+=dt*2.2; f.src.i=1.5+Math.sin(f.phase)*.25; f.glow.scale.setScalar(1+Math.sin(f.phase*1.6)*.1); }
    else if(f.type==='candle'){ f.phase+=dt*9; f.src.i=f.src.base+Math.sin(f.phase)*.15; }
    else if(f.type==='slash'){ f.life-=dt; if(f.life<=0){ G.scene.remove(f.m); G.fx.splice(i,1); } else { f.m.material.opacity=f.life/f.max*.85; f.m.scale.setScalar(1+(1-f.life/f.max)*.4); } }
    else if(f.type==='ring'){ f.life-=dt; if(f.life<=0){ G.scene.remove(f.m); G.fx.splice(i,1); } else { const k=1-f.life/f.max; f.m.scale.setScalar(.3+k*f.r*1.05); f.m.material.opacity=.8*(1-k); } }
  }
}

function updateDog(dt){
  const dog=G.dog; if(!dog||!dog.visible||!P.group) return; const u=dog.userData, pp=P.group.position;
  if(S.stage==='dog'){ u.walk+=dt*2.5; u.tail.rotation.z=Math.sin(G.time*5)*.3; return; }
  const si=stageIdx(), leading=si>=STAGE_ORDER.indexOf('trail')&&S.stage!=='warden'&&S.stage!=='done';
  const wp=leading?objectiveWaypoint():null;
  const fighting=G.enemies.some(e=>e.alive&&e.aggro&&e.state!=='idle'&&e.mesh.position.distanceTo(pp)<18);
  let tgt, speed=4.6;
  if(wp&&!fighting&&S.stage!=='ambush'){
    const toWp=V3(wp.x-pp.x,0,wp.z-pp.z), dWp=toWp.length(), dir=dWp>1e-3?toWp.clone().normalize():V3(0,0,-1);
    // run ahead of the player toward the objective, never farther than 8 units out; sit at the objective once close
    if(dWp<4) tgt=V3(wp.x+1.2,0,wp.z+1.2); else tgt=V3(pp.x,0,pp.z).addScaledVector(dir,Math.min(8,dWp-2)); tgt.x+=dir.z*-1.2;
    // wait if the player lags: stop and look back when too far ahead
    const gap=dog.position.distanceTo(pp); if(gap>11) speed=2.2; if(gap>14){ tgt.copy(pp).addScaledVector(dir,3); }
  } else {
    tgt=V3(pp.x+Math.sin(P.facing)*1.4+1.8,0,pp.z+(S.stage==='ambush'?3:1.6)); speed=5.5;
  }
  const dx=tgt.x-dog.position.x,dz=tgt.z-dog.position.z, dist=Math.hypot(dx,dz);
  if(dist>40) dog.position.set(tgt.x,0,tgt.z);
  else if(dist>.4){ const sp=Math.min(dist*3,dist>3?speed+2.5:speed), step=Math.min(dist,sp*dt); dog.position.x+=dx/dist*step; dog.position.z+=dz/dist*step; }
  if(dist>.5) dog.rotation.y+=angDiff(dog.rotation.y,Math.atan2(dx,dz))*Math.min(1,dt*9);
  else if(wp){ const lx=pp.x-dog.position.x,lz=pp.z-dog.position.z; dog.rotation.y+=angDiff(dog.rotation.y,Math.atan2(lx,lz))*Math.min(1,dt*3); }
  const moving=dist>.8, gait=moving?(dist>3?12:8):2.5;
  u.walk+=dt*gait; u.body.position.y=.7+Math.abs(Math.sin(u.walk))*(moving?.05:.008); u.head.rotation.x=moving?Math.sin(u.walk)*.06:Math.sin(G.time*1.4)*.03; u.tail.rotation.z=Math.sin(G.time*(moving?9:5))*.3;
  if(dog.position.z>15) dog.position.z=15; if(dog.position.z<-137) dog.position.z=-137;
}

  }[kind];

  <div class="menurow"><button class="primary" id="bAgain">Begin again</button><button id="bTitle">Return to title</button></div>`);
  AudioSys.sfx('win'); bind('#bAgain',()=>{ Save.clear(); location.reload(); }); bind('#bTitle',()=>location.reload());
}

/* ===== 29 · START / CONTINUE ===== */
function enterWorld(){
  clearEnemies(false); G.bossAlive=null; G.arena=null; P.state='idle'; P.act=null; P.buffer=null; P.blocking=false; P.rig.hips.rotation.x=0;
  $('#hud').classList.remove('hidden'); if(G.touchOn) $('#touch').classList.add('on'); hidePanel(); G.menu=false; G.started=true; G.timeScale=1;
  $('#banner').classList.remove('on'); $('#flash').style.opacity=0; setObjective(STAGES[S.stage][0]); $('#chapter').textContent=STAGES[S.stage][1];
}
function startNewGame(){
  AudioSys.init(); AudioSys.resume(); Save.clear(); resetState(); derive(); S.hp=D.maxHp; S.fp=D.maxFp; S.stam=D.maxStam;
  P.group.position.set(0,0,8); P.facing=Math.PI; P.group.rotation.y=Math.PI; G.dog.visible=false; G.mara.position.set(2.4,0,8.6);
  enterWorld(); syncWorld(); respawnEnemies(); G.camYaw=Math.PI; G.camPitch=.3; updateCamera(0,true); setStage('intro',true);
  Cinematic.start([{t:0,pos:V3(-14,4.5,12),look:V3(-8,1.6,2)},{t:2.4,pos:V3(-8,5.2,6),look:V3(-2,1.6,4)},{t:4.8,pos:V3(8,4.2,8),look:V3(2,1.3,6)},{t:7,pos:V3(3,3.4,16),look:V3(0,1.2,8)},{t:9.4,pos:V3(0,4.2,16.5),look:V3(0,1.1,8)}],9.4,()=>{
    G.camYaw=Math.PI; G.camPitch=.3; updateCamera(0,true); setStage('search'); Dialogue.say('Mara','Let us search before the rain buries what is left.'); combatTip('WASD move · look for the marked doorway and the dry well',5); });
  const ct=$('#cineTitle'); ct.querySelector('.ct-kicker').textContent='A TALE OF ASH & NAMES'; ct.querySelector('.ct-main').textContent='ASHFALL'; ct.querySelector('.ct-sub').textContent='PROLOGUE · ASHES BEFORE DAWN'; ct.classList.add('on'); setTimeout(()=>ct.classList.remove('on'),4800);
  Dialogue.say('Orin','Three nights now. No smoke, no birds. Only that bell, ringing under the river.'); Dialogue.say('Mara','Bells do not ring beneath water, Keeper.');
  Dialogue.say('Orin','Neither do the dead. I have checked.'); Dialogue.say('Mara','You came back for your sister.'); Dialogue.say('Orin','I came back because I heard her whistle in the wind.');
}
function continueGame(){
  AudioSys.init(); AudioSys.resume(); if(!loadGameData()){ toast('NO SAVE FOUND'); return; }
  const gr=G.graces.find(g=>g.id===S.grace)||G.graces[0]; P.group.position.set(gr.x+1.6,0,gr.z+1.4); P.facing=Math.PI; G.mara.position.set(gr.x+3,0,gr.z+2);
  G.dog.visible=!!S.flags.dogMet; G.dog.position.set(gr.x-2,0,gr.z);
  enterWorld(); derive(); S.hp=D.maxHp; S.fp=D.maxFp; S.stam=D.maxStam; S.flasks=S.maxFlasks; S.fflasks=S.maxFflasks; equipWeaponMesh();
  if(S.stage==='intro') S.stage='search'; if(S.stage==='warden') S.stage='bell';
  setStage(S.stage,true); syncWorld(); respawnEnemies(); G.camYaw=Math.PI; updateCamera(0,true); Dialogue.say('Mara','We should finish what we started.');
}
function clueFound(w){
  S.flags[w]=true; AudioSys.sfx('pickup');
  if(w==='door'){ Dialogue.say('Orin','Elara carved this by our door when she was six. Three lines and a loop. Her name, before she could spell it.'); Dialogue.say('Mara','Then whoever came here knew exactly which house to search.'); }
  else { Dialogue.say('Mara','No bodies. No blood. No bucket either.'); Dialogue.say('Orin','A village does not empty itself. Someone took them. Alive.'); }
  if(S.flags.door&&S.flags.well){ setStage('dog'); G.dog.visible=true; G.dog.position.set(5.4,0,-3.2); AudioSys.sfx('magic'); toast('A SOUND IN THE ASH'); Dialogue.say('Mara','Listen. Something is still breathing here.'); }
}

/* ===== 30 · INPUT ===== */
function toggleLock(){
  if(G.lock){ G.lock=null; return; }
  let best=null,bs=1e9; for(const e of G.enemies){ if(!e.alive) continue; const dx=e.mesh.position.x-P.group.position.x,dz=e.mesh.position.z-P.group.position.z,d=Math.hypot(dx,dz); if(d>26) continue;
    const s=Math.abs(angDiff(G.camYaw,Math.atan2(dx,dz)))*8+d*.15; if(s<bs){ bs=s; best=e; } }
  if(best){ G.lock=best; AudioSys.sfx('ui2'); } else combatTip('NO TARGET',1);
}
function cycleLock(){
  const list=G.enemies.filter(e=>e.alive&&e.mesh.position.distanceTo(P.group.position)<26); if(!list.length) return;
  const i=list.indexOf(G.lock); G.lock=list[(i+1)%list.length]; AudioSys.sfx('ui2');
}
function swapWeapon(i){ if(!S.weapons[i]||S.weapon===i||P.state!=='idle') return; S.weapon=i; equipWeaponMesh(); P.combo=0; combatTip(WEAPONS[i].name.toUpperCase(),1.4); AudioSys.sfx('ui2'); }
function bindInput(){
  addEventListener('keydown',e=>{
    if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    if(e.repeat) return; G.keys[e.code]=true;
    if(Cinematic.active&&(e.code==='Enter'||e.code==='Space')){ Cinematic.t=Cinematic.dur; return; }
    if(!G.started||G.paused){ if(e.code==='Escape'&&G.started&&P.state!=='dead'&&!G.paused) pauseMenu(); else if(e.code==='Escape'&&G.started&&G.paused&&$('#bRes')) hidePanel(); return; }
    switch(e.code){
      case 'Space': P.spaceT=G.time; P.spaceHeld=true; break;
      case 'KeyE': doInteract(); break; case 'KeyR': bufferAction('flask0'); break; case 'KeyG': bufferAction('flask1'); break; case 'KeyF': bufferAction('art'); break;
      case 'Tab': toggleLock(); break; case 'KeyZ': cycleLock(); break; case 'KeyC': maraAssist(); break;
      case 'Digit1': swapWeapon(0); break; case 'Digit2': swapWeapon(1); break; case 'Digit3': swapWeapon(2); break;
      case 'KeyM': G.mmMode=((G.mmMode||0)+1)%3; applyMapSize(); break;
      case 'KeyH': $('#hint').classList.toggle('on'); break; case 'Escape': pauseMenu(); break;
    }
  });
  addEventListener('keyup',e=>{ G.keys[e.code]=false; if(e.code==='Space'){ if(P.spaceHeld&&G.time-P.spaceT<.22&&G.started&&!G.paused) bufferAction('roll'); P.spaceHeld=false; } });
  const cv=G.renderer.domElement;
  cv.addEventListener('mousedown',e=>{ if(!G.started||G.paused||Cinematic.active) return; if(document.pointerLockElement!==cv){ cv.requestPointerLock&&cv.requestPointerLock(); return; } if(e.button===0) bufferAction('light'); if(e.button===2) bufferAction('heavy'); if(e.button===1){ e.preventDefault(); toggleLock(); } });
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('mousemove',e=>{ if(document.pointerLockElement===cv&&!G.paused&&G.started&&!Cinematic.active){ const s=.0022*S.settings.sens; G.camYaw-=e.movementX*s; G.camPitch=clamp(G.camPitch+e.movementY*s*.7,.03,1); } });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G.started&&!G.paused&&P.state!=='dead'&&!Cinematic.active) pauseMenu(); });
  addEventListener('gamepadconnected',()=>combatTip('CONTROLLER CONNECTED',2));
  /* touch */
  const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window; G.touchOn=touch;
  if(touch){
    const stick=$('#stick'),knob=$('#knob'); let sid=null,sc=null;
    const setStick=e=>{ const r=stick.getBoundingClientRect(); const cx=r.left+r.width/2,cy=r.top+r.height/2; let dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2); const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; } padInput.x=dx; padInput.y=dy; knob.style.transform=`translate(${dx*40}px,${dy*40}px)`; };
    stick.addEventListener('pointerdown',e=>{ sid=e.pointerId; stick.setPointerCapture(sid); setStick(e); }); stick.addEventListener('pointermove',e=>{ if(e.pointerId===sid) setStick(e); });
    const end=e=>{ if(e.pointerId===sid){ sid=null; padInput.x=padInput.y=0; knob.style.transform=''; } }; stick.addEventListener('pointerup',end); stick.addEventListener('pointercancel',end);
    const lp=$('#lookpad'); let lid=null,lx=0,ly=0;
    lp.addEventListener('pointerdown',e=>{ lid=e.pointerId; lp.setPointerCapture(lid); lx=e.clientX; ly=e.clientY; });
    lp.addEventListener('pointermove',e=>{ if(e.pointerId!==lid||G.paused) return; const s=.005*S.settings.sens; G.camYaw-=(e.clientX-lx)*s; G.camPitch=clamp(G.camPitch+(e.clientY-ly)*s*.7,.03,1); lx=e.clientX; ly=e.clientY; });
    lp.addEventListener('pointerup',()=>{ lid=null; });
    const tb=(id,fn,up)=>{ const el=$(id); el.addEventListener('pointerdown',e=>{ e.preventDefault(); if(G.started&&!G.paused&&!Cinematic.active) fn(); }); if(up) { el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); } };
    tb('#tbL',()=>bufferAction('light')); tb('#tbH',()=>bufferAction('heavy')); tb('#tbR',()=>bufferAction('roll')); tb('#tbG',()=>{ G.touchGuard=true; },()=>{ G.touchGuard=false; });
    tb('#tbF',()=>bufferAction('flask0')); tb('#tbT',()=>toggleLock()); tb('#tbE',()=>doInteract()); tb('#tbA',()=>bufferAction('art')); $('#tbP').addEventListener('pointerdown',()=>{ if(G.started&&!G.paused) pauseMenu(); });
  }
}
let prevPad=[];
function pollGamepad(){
  if(G.started&&!G.paused){ const gp=(navigator.getGamepads?navigator.getGamepads():[])[0];
    if(gp){ const ax=gp.axes; padInput.x=Math.abs(ax[0])>.2?ax[0]:(G.touchOn?padInput.x:0); padInput.y=Math.abs(ax[1])>.2?ax[1]:(G.touchOn?padInput.y:0);
      const b=gp.buttons.map(x=>x.pressed), pr=i=>b[i]&&!prevPad[i];
      if(pr(0)) bufferAction('roll'); if(pr(2)) bufferAction('light'); if(pr(3)) bufferAction('heavy'); if(pr(5)) bufferAction('art'); if(pr(1)) bufferAction('flask0'); if(pr(8)||pr(10)) toggleLock(); if(pr(9)) pauseMenu(); if(pr(14)) doInteract();
      G.touchGuard=!!b[4]||G.touchGuard&&!gp; if(Math.abs(ax[2])>.15) G.camYaw-=ax[2]*.045; if(Math.abs(ax[3])>.15) G.camPitch=clamp(G.camPitch+ax[3]*.03,.03,1); prevPad=b; } }
  requestAnimationFrame(pollGamepad);
}

/* ===== 31 · SCENE ===== */
function applyMapSize(){
  const w=$('#minimapWrap'), q=$('#quest'), mode=G.mmMode||0, small=innerWidth<820;
  const base=small?[130,200]:[210,330]; const sz=Math.min(base[mode===1?1:0],innerWidth*(mode===1?.6:.42));
  if(mode===2){ w.style.display='none'; q.style.top=(small?70:90)+'px'; return; }
  w.style.display='block'; w.style.width=w.style.height=sz+'px'; q.style.top=(sz+(small?24:34))+'px'; G.mmRange=mode===1?75:55;
}
function onResize(){ applyMapSize(); if(!G.renderer) return; const w=innerWidth,h=innerHeight; G.camera.aspect=w/h; G.camera.updateProjectionMatrix(); G.renderer.setSize(w,h); if(G.composer) G.composer.setSize(w,h); if(G.bloom) G.bloom.setSize(w,h); }
addEventListener('resize',onResize);
function initScene(){
  const c=QP[S.settings.quality]||QP.medium;
  G.scene=new THREE.Scene(); G.scene.background=new THREE.Color(0x080b0e); G.scene.fog=new THREE.FogExp2(0x141312,.02);
  G.camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300); G.camera.position.set(0,4,16);
  G.renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); G.renderer.setPixelRatio(Math.min(devicePixelRatio||1,c.pr)); G.renderer.setSize(innerWidth,innerHeight);
  G.renderer.shadowMap.enabled=c.shadows; G.renderer.shadowMap.type=THREE.PCFSoftShadowMap; G.renderer.toneMapping=THREE.ACESFilmicToneMapping; G.renderer.toneMappingExposure=1.1; G.renderer.outputColorSpace=THREE.SRGBColorSpace;
  document.body.insertBefore(G.renderer.domElement,document.body.firstChild);
  try{ const pm=new THREE.PMREMGenerator(G.renderer); G.scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture; }catch(e){}
  G.hemi=new THREE.HemisphereLight(0x9fb8c0,0x1a1410,.55); G.scene.add(G.hemi);
  G.sun=new THREE.DirectionalLight(0xc8d8e8,2.0); G.sun.position.set(-18,30,12); G.sun.castShadow=c.shadows; G.sun.shadow.mapSize.set(c.sm,c.sm);
  Object.assign(G.sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:90}); G.sun.shadow.bias=-.0008; G.scene.add(G.sun); G.scene.add(G.sun.target);
  const rim=new THREE.DirectionalLight(0xffb070,.6); rim.position.set(10,8,-20); G.scene.add(rim);
  initMaterials(); buildWorld(); buildPlayer(); G.dog=createDog(); G.mara=createMara(); FX.init(); FX.mult=c.part; initLightPool(7); buildWorldObjects();
  MM.canvas=$('#minimap'); MM.ctx=MM.canvas.getContext('2d');
  G.composer=new EffectComposer(G.renderer); G.composer.addPass(new RenderPass(G.scene,G.camera));
  G.bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),c.bs,.55,.82); G.bloom.enabled=c.bloom; G.composer.addPass(G.bloom); G.composer.addPass(new OutputPass());
  G.clock=new THREE.Clock();
}
function updateAtmosphere(dt){
  const reg=REGIONS[regionAt(P.group.position.z)], c=QP[S.settings.quality]||QP.medium, k=1-Math.exp(-1.2*dt);
  G.scene.fog.color.lerp(new THREE.Color(reg.fog),k); G.scene.fog.density=damp(G.scene.fog.density,reg.density*c.fog,1.2,dt);
  G.scene.background.lerp(new THREE.Color(reg.ground),k); G.hemi.color.lerp(new THREE.Color(reg.sky),k); G.hemi.intensity=damp(G.hemi.intensity,reg.amb,1.2,dt);
  M.water.uniforms.uFogColor.value.copy(G.scene.fog.color); M.water.uniforms.uFogDensity.value=G.scene.fog.density;
  G.sun.position.set(P.group.position.x-18,30,P.group.position.z+12); G.sun.target.position.set(P.group.position.x,0,P.group.position.z); G.sun.target.updateMatrixWorld();
  G.moon.position.set(P.group.position.x-70,60,P.group.position.z-130);
}
function updatePrompt(){
  const it=nearestInteractable(), el=$('#prompt');
  if(it&&P.state==='idle'){ const l=typeof it.label==='function'?it.label():it.label; el.textContent=(G.touchOn?'USE · ':'[E] ')+l; el.classList.add('on'); } else el.classList.remove('on');
  for(const g of G.graces){ g.beam.rotation.y+=dtGlobal*.3; g.ring.rotation.z+=dtGlobal; }
  for(const p of PICKUPS){ if(p.group&&p.group.visible){ p.gem.position.y=.9+Math.sin(G.time*2+p.x)*.08; p.gem.rotation.y+=dtGlobal*1.6; } }
  for(const g of G.gates) if(g.mesh&&g.mesh.visible) g.mesh.material.uniforms.uT.value=G.time;
}
function updateGame(dt){
  const sd=dt*G.timeScale;
  updatePlayer(sd); updateEnemies(sd); updateCorpses(sd); updateProjectiles(sd); updateHazards(sd); updateFX(sd); updateAmbient(sd); updateDog(sd); updateMara(sd); updateAtmosphere(sd); updateLights(dt); updatePrompt(); Dialogue.update(dt);
  G.lastHitT=Math.max(0,G.lastHitT-dt); if(G.lock&&(!G.lock.alive||G.lock.mesh.position.distanceTo(P.group.position)>34)) G.lock=null;
  if(G.bossAlive&&!G.bossAlive.alive) G.bossAlive=null;
  if(G.bell&&G.bell.userData.swing>0){ G.bell.userData.swing=Math.max(0,G.bell.userData.swing-dt*.5); G.bell.rotation.z=Math.sin(G.time*6)*G.bell.userData.swing*.25; }
  if(S.stain&&P.state!=='dead'&&Math.hypot(S.stain.x-P.group.position.x,S.stain.z-P.group.position.z)<2){ S.runes+=S.stain.runes; runeGain(S.stain.runes); S.stain=null; syncWorld(); toast('RUNES RECOVERED'); AudioSys.sfx('pickup'); }
  if(G.stainObj) G.stainObj.rotation.y+=dt;
  if(G.time-G.lastBark>26&&Math.random()<dt*.1&&!G.dialogue.current&&!G.bossAlive){ G.lastBark=G.time;
    if(S.stage==='search') Dialogue.say('Mara',pick(['There are footprints going into the water. None coming back out.','This village had a name once. Someone scraped it off the gate.','The ash is too even. This was not a fire. This was a decision.']));
    else if(S.stage==='bell') Dialogue.say('Mara',pick(['The causeway was built to be walked by the dead.','Every lantern still burns. Who lights them?','I can hear the bell through the water. That should not be possible.'])); }
}
function updateMenu(dt){ const a=G.realTime*.09, r=21; G.camera.position.set(Math.sin(a)*r,6.5+Math.sin(a*.6)*1.4,2+Math.cos(a)*r); G.camera.lookAt(0,2,-2); updateAmbient(dt); updateLights(dt); updateFX(dt); for(const g of G.graces) g.beam.rotation.y+=dt*.3; for(const g of G.gates) g.mesh.material.uniforms.uT.value=G.time; }
function render(){ if(G.composer&&S.settings.bloom&&G.bloom&&G.bloom.enabled) G.composer.render(); else G.renderer.render(G.scene,G.camera); }
G.lastBark=0;
function loop(){
  requestAnimationFrame(loop);
  const raw=Math.min(G.clock.getDelta(),.05); G.realTime+=raw; G.time+=raw; dtGlobal=raw; G.shake=Math.max(0,G.shake-raw*.9);
  M.water.uniforms.uTime.value=G.time;
  if(G.menu){ if(!LS.pool.length||!P.group){} else { if(!P.group.position) {} } updateMenu(raw); render(); return; }
  if(Cinematic.active){ Cinematic.update(raw); updateAmbient(raw); Dialogue.update(raw); updateFX(raw); updateLights(raw); render(); return; }
  if(G.hitstop>0){ G.hitstop-=raw; Dialogue.update(raw); updateAmbient(raw); render(); return; }
  if(!G.paused){ updateGame(raw); updateCamera(raw); FPSWatch.tick(raw); }
  G.hudT-=raw; if(G.hudT<=0){ G.hudT=.05; updateHUD(); }
  G.mmT-=raw; if(G.mmT<=0){ G.mmT=.08; drawMinimap(); }
  updateTargetUI();
  if(G.toastT>0){ G.toastT-=raw; if(G.toastT<=0) $('#toast').classList.remove('on'); }
  if(G.tipT>0){ G.tipT-=raw; if(G.tipT<=0) $('#combatTip').classList.remove('on'); }
  if(G.bannerT>0){ G.bannerT-=raw; if(G.bannerT<=0) $('#banner').classList.remove('on'); }
  render();
}
function boot(){
  AutoQuality.detect(); initScene(); G.mmRange=55; applyMapSize(); AutoQuality.apply(S.settings.quality,true); bindInput(); pollGamepad(); showTitle(); loop();
  setTimeout(()=>{ $('#hint').classList.add('on'); setTimeout(()=>$('#hint').classList.remove('on'),6500); },1200);
}
boot();

</script>
